name: PR Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional Gradle test task + filter (e.g. :spring-security-core:test --tests FooTests); empty runs the full build'
        required: false
        default: ''

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: '8'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
      - name: Build with Gradle
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./gradlew clean assemble ${{ inputs.test-filter }}
          else
            ./gradlew clean build --continue
          fi
      - name: Test results summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, re
          import xml.etree.ElementTree as ET
          mods = {}
          skipped = []
          def find_ignore(cls, method):
              rel = cls.split('$')[0].replace('.', '/') + '.java'
              for f in glob.glob('**/src/*/java/' + rel, recursive=True):
                  lines = open(f, encoding='utf-8', errors='replace').read().splitlines()
                  for i, l in enumerate(lines):
                      if re.search(r'\bvoid\s+' + re.escape(method) + r'\s*\(', l):
                          for j in range(i - 1, max(i - 8, -1), -1):
                              if '@Ignore' in lines[j] or '@Disabled' in lines[j]:
                                  return '%s:%d `%s`' % (f, j + 1, lines[j].strip())
                  for j, l in enumerate(lines):
                      if re.match(r'\s*@(Ignore|Disabled)', l):
                          return '%s:%d `%s` (class-level)' % (f, j + 1, l.strip())
              return None
          for x in sorted(glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True)):
              mod = x.split('/build/test-results/')[0]
              r = ET.parse(x).getroot()
              m = mods.setdefault(mod, [0, 0, 0, 0])
              m[0] += int(r.get('tests', 0)); m[1] += int(r.get('failures', 0))
              m[2] += int(r.get('errors', 0)); m[3] += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  s = tc.find('skipped')
                  if s is not None:
                      msg = (s.get('message') or '').strip()
                      src = find_ignore(tc.get('classname'), tc.get('name'))
                      if not msg:
                          msg = ('disabled by upstream with a bare @Ignore annotation (upstream gives no reason), at ' + src) if src else 'skipped (no message in report; no annotation found in source)'
                      skipped.append('SKIPPED TEST %s.%s -- reason: %s' % (tc.get('classname'), tc.get('name'), msg))
          T = [0, 0, 0, 0]
          for mod, m in sorted(mods.items()):
              print('TEST MODULE %s: tests=%d passed=%d failures=%d errors=%d skipped=%d' % (mod, m[0], m[0] - m[1] - m[2] - m[3], m[1], m[2], m[3]))
              T = [a + b for a, b in zip(T, m)]
          for s in skipped:
              print(s)
          print('TEST SUMMARY: tests=%d passed=%d failures=%d errors=%d skipped=%d' % (T[0], T[0] - T[1] - T[2] - T[3], T[1], T[2], T[3]))
          EOF
      - name: Upload spring-security-core jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-security-core-jar
          path: core/build/libs/spring-security-core-5.1.13.RELEASE.jar
          if-no-files-found: error
